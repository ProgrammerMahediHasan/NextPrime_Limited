<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="NextPrime">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#3C7BFF"/>
      <stop offset="1" stop-color="#0EB4D1"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5A67D8"/>
      <stop offset="1" stop-color="#6B46C1"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB200"/>
      <stop offset="1" stop-color="#FFC94A"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="b"/>
      <feOffset dy="1.2" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="none"/>
  <g transform="translate(0,0)">
    <circle cx="32" cy="32" r="28" fill="url(#bg)"/>
    <circle cx="32" cy="32" r="28" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.9"/>
    <circle cx="32" cy="32" r="22" fill="url(#glass)"/>
    <g filter="url(#shadow)">
      <path d="M20 44 L20 20 L26 20 L40 38 L40 20 L44 20 L44 44 L36 44 L24 28 L24 44 Z" fill="#ffffff"/>
    </g>
    <circle cx="44" cy="18" r="3.2" fill="url(#accent)"/>
  </g>
</svg>
